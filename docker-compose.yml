# Бот Telegram на сервере chat-engine. Chat API — на другом сервере, за Cloudflare Access.
# Деплой: deploy/update.sh из workflow Deploy. Значения берутся из .env рядом.

services:
  tg-bot:
    image: ${TG_BOT_IMAGE:?Задайте TG_BOT_IMAGE}
    container_name: dating-tg-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Задайте TELEGRAM_BOT_TOKEN}
      CHAT_API_URL: ${CHAT_API_URL:-https://api.chatwithyou.site}
      CHAT_API_TG_TOKEN: ${CHAT_API_TG_TOKEN:?Задайте CHAT_API_TG_TOKEN}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:?Задайте CF_ACCESS_CLIENT_ID}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:?Задайте CF_ACCESS_CLIENT_SECRET}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
