name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - .github/workflows/deploy.yml

concurrency:
  group: deploy-tg-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Добавьте секрет $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "tg_bot_image=${user}/dating-tg-bot:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push Telegram bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.tg_bot_image }}
          cache-from: type=gha,scope=tg-bot
          cache-to: type=gha,scope=tg-bot,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          TG_DEPLOY_HOST: ${{ secrets.TG_DEPLOY_HOST }}
          TG_DEPLOY_USER: ${{ secrets.TG_DEPLOY_USER }}
          TG_DEPLOY_SSH_KEY: ${{ secrets.TG_DEPLOY_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_API_TG_TOKEN: ${{ secrets.CHAT_API_TG_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=0
          for name in TG_DEPLOY_HOST TG_DEPLOY_USER TG_DEPLOY_SSH_KEY TELEGRAM_BOT_TOKEN CHAT_API_TG_TOKEN CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Добавьте секрет $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Update Telegram bot
        uses: appleboy/ssh-action@v1.2.2
        env:
          TG_DEPLOY_PATH: ${{ secrets.TG_DEPLOY_PATH }}
          GIT_SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_API_TG_TOKEN: ${{ secrets.CHAT_API_TG_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        with:
          host: ${{ secrets.TG_DEPLOY_HOST }}
          username: ${{ secrets.TG_DEPLOY_USER }}
          key: ${{ secrets.TG_DEPLOY_SSH_KEY }}
          port: ${{ secrets.TG_DEPLOY_PORT || 22 }}
          command_timeout: 15m
          envs: TG_DEPLOY_PATH,GIT_SHA,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,TELEGRAM_BOT_TOKEN,CHAT_API_TG_TOKEN,CF_ACCESS_CLIENT_ID,CF_ACCESS_CLIENT_SECRET
          script: |
            set -eu
            APP_DIR="${TG_DEPLOY_PATH:-${HOME}/dating-bot-tg}"
            hub_user=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
            export TG_BOT_IMAGE="${hub_user}/dating-tg-bot:${GIT_SHA}"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/aStormspirit/dating-bot-tg.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git remote set-url origin https://github.com/aStormspirit/dating-bot-tg.git
            git fetch origin "$GIT_SHA"
            git checkout --detach --force "$GIT_SHA"
            sh deploy/update.sh
